<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Euge Gadda | Home Portfolio</title>
  
  <!-- Carga de tipografía Arapey y Montserrat para botones/navegación -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arapey:ital@0;1&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* VARIABLES Y RESET */
    :root {
      --bg-color: #ffffff;
      --text-color: #111111;
      --btn-dark: #3a3a3a;
      --btn-border: #3a3a3a;
      --font-serif: 'Arapey', serif;
      --font-sans: 'Montserrat', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-serif);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* HEADER / NAVEGACIÓN */
    header {
      width: 100%;
      padding: 40px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container img {
      width: 50px;
      height: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    .nav-links a {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-color);
      text-decoration: underline;
      text-underline-offset: 4px;
      transition: opacity 0.2s;
    }

    .nav-links a:hover {
      opacity: 0.6;
    }

    /* MAIN / SECCIÓN HERO */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 20px 40px;
    }

    .hero-content {
      max-width: 900px;
      text-align: center;
      z-index: 2;
    }

    .hero-title {
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 400;
      line-height: 1.3;
      color: var(--text-color);
      margin-bottom: 40px;
    }

    .hero-title .italic {
      font-style: italic;
    }

    /* ESTILO DE IMAGEN FLOWER/CORTADA A LA IZQUIERDA DEL TEXTO */
    .inline-photo {
      display: inline-block;
      vertical-align: middle;
      width: 80px;
      height: 80px;
      margin-right: 12px;
      margin-bottom: 8px;
      border-radius: 50%; /* O ajustá según tu máscara de flor */
      object-fit: cover;
    }

    /* BOTONES */
    .cta-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    .btn {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 700;
      padding: 12px 36px;
      border-radius: 30px;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-block;
    }

    .btn-dark {
      background-color: var(--btn-dark);
      color: #ffffff;
      border: 2px solid var(--btn-dark);
    }

    .btn-dark:hover {
      background-color: #000;
      border-color: #000;
    }

    .btn-outline {
      background-color: transparent;
      color: var(--text-color);
      border: 1.5px solid var(--btn-border);
    }

    .btn-outline:hover {
      background-color: #f5f5f5;
    }

    /* ELEMENTOS DECORATIVOS A LA DERECHA */
    .decorations-right {
      position: absolute;
      right: 5%;
      bottom: 15%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      pointer-events: none;
      z-index: 1;
    }

    .badge-pink {
      width: 170px;
      transform: rotate(8deg);
      margin-bottom: -30px;
      margin-right: -10px;
    }

    .badge-purple {
      width: 100px;
      transform: rotate(-5deg);
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      header {
        padding: 20px;
      }
      .decorations-right {
        display: none; /* Oculta stickers en celular para evitar superposición */
      }
      .hero-title {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo-container">
      <!-- Cambiá "logo.png" por la ruta de tu isotipo 'e' -->
      <img src="logo.png" alt="Logo e">
    </div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="#trabajo">TRABAJO</a></li>
        <li><a href="#sobre-mi">SOBRE MÍ</a></li>
      </ul>
    </nav>
  </header>

  <!-- SECCIÓN PRINCIPAL -->
  <main>
    <div class="hero-content">
      <h1 class="hero-title">
        ¡Hola! Soy <span class="italic">Euge Gadda</span><br>
        <!-- Reemplazá foto.jpg por tu foto con forma de flor -->
        <img src="foto.jpg" alt="Euge Gadda" class="inline-photo"> 
        Lic. Prof. especializada en<br>
        Comunicación ༄ Proyectos Multimedia<br>
        con experiencia en Gestión & Producción
      </h1>

      <div class="cta-container">
        <a href="#contacto" class="btn btn-dark">Hablemos</a>
        <a href="#trabajo" class="btn btn-outline">Mi trabajo</a>
      </div>
    </div>

    <!-- STICKERS/DECORACIONES DE LA DERECHA -->
    <div class="decorations-right">
      <!-- Cambiá las URLs por tus stickers en PNG transparente -->
      <img src="sticker-hello.png" alt="Hello Badge" class="badge-pink">
      <img src="sticker-ideas.png" alt="Ideas Badge" class="badge-purple">
    </div>
  </main>

</body>
</html>
